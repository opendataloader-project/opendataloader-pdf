name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # =================================================================
  # 0. PREFLIGHT — verify deploy credentials authenticate BEFORE the
  #    long build, so an expired token / missing scope fails in ~1 min
  #    instead of after ~30-40 min (and avoids a partial publish).
  #    Defined in preflight.yml so it can also be run on its own from
  #    the Actions tab (Run workflow) to check credentials without a build.
  # =================================================================
  preflight:
    uses: ./.github/workflows/preflight.yml
    permissions:
      contents: read
      id-token: write
    # Explicit pass-through (least privilege) — only the 6 secrets preflight uses.
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      HOMEPAGE_SYNC_TOKEN: ${{ secrets.HOMEPAGE_SYNC_TOKEN }}

  release:
    needs: preflight
    runs-on: ubuntu-latest
    env:
      VERSION: '0.0.0'
    permissions:
      contents: write
      id-token: write

    steps:
      # =================================================================
      # 1. SETUP
      # =================================================================
      - name: Checkout code
        uses: actions/checkout@v7

      # A refname may contain `$(`, a backtick and `;`, and later steps
      # interpolate VERSION into shell commands, so git's own rules are not a
      # validation layer.
      - name: Initialize VERSION
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
              || { echo "::error::tag '${GITHUB_REF_NAME}' is not vN.N.N[-suffix]" >&2; exit 1; }
            echo "VERSION=$v" >> $GITHUB_ENV
          else
            echo "VERSION=0.0.0" >> $GITHUB_ENV
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_KEY }}
          gpg-passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Node.js and pnpm
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # =================================================================
      # 2. BUILD & TEST
      # =================================================================
      - name: Build and test all packages
        run: ./scripts/build-all.sh ${{ env.VERSION }}

      # =================================================================
      # 3. VERIFY CLI OPTIONS (before deploy)
      # =================================================================
      - name: Install opendataloader-pdf CLI
        # --system installs into the setup-python interpreter; without it (or an
        # active venv) `uv pip install` aborts with "No virtual environment found".
        run: uv pip install --system ./python/opendataloader-pdf/dist/*.whl

      - name: Run CLI verification
        # ci-verify.py writes its own markdown table to $GITHUB_STEP_SUMMARY,
        # so no separate summary step is needed here.
        run: python verification/ci-verify.py

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-report-release
          path: verification/verification-report-ci.txt
          retention-days: 30

      # =================================================================
      # 4. DEPLOY (only on tag push)
      # =================================================================
      - name: '[Java] Deploy to Maven Central'
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: mvn -B -pl opendataloader-pdf-core deploy -P release
        working-directory: ./java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: '[Python] Publish to PyPI'
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./python/opendataloader-pdf/dist

      - name: '[Node.js] Publish to npm'
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: pnpm publish --no-git-checks
        working-directory: ./node/opendataloader-pdf
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # =================================================================
      # 5. GITHUB RELEASE (only on tag push)
      # =================================================================
      - name: Package CLI as ZIP
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          cd java/opendataloader-pdf-cli/target
          mkdir -p release
          cp "opendataloader-pdf-cli-${{ env.VERSION }}.jar" release/
          cp ../../../README.md release/
          cp ../../../LICENSE release/
          cp ../../../NOTICE release/
          cp -r ../../../THIRD_PARTY release/
          cd release
          zip -r "../opendataloader-pdf-cli-${{ env.VERSION }}.zip" .
          cd ../..

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
            tag_name: ${{ github.ref_name }}
            name: Release ${{ github.ref_name }}
            generate_release_notes: true
            files: |
              java/opendataloader-pdf-cli/target/opendataloader-pdf-cli-${{ env.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =================================================================
      # 6. BEGIN THE NEXT DEVELOPMENT VERSION (only on tag push)
      # =================================================================
      # Without this, the next push to main would republish a snapshot under a
      # coordinate that is now a release.
      #
      # After the publishes, not before: a bump ahead of a failed deploy would
      # leave main claiming a release that does not exist.
      #
      # PATCH by default — raise MINOR or MAJOR by hand before tagging.
      - name: Begin the next development version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          HOMEPAGE_SYNC_TOKEN: ${{ secrets.HOMEPAGE_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$VERSION" == *-* ]]; then
            next="${VERSION%%-*}"
          else
            IFS=. read -r major minor patch <<< "$VERSION"
            next="${major}.${minor}.$((patch + 1))"
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Built on main as it is now, not on the tag: main has usually moved
          # on by the time a release finishes, and committing on the tag would
          # be rejected non-fast-forward after both publishes had succeeded.
          # The steps after this one read options.json and schema.json from the
          # working tree, so it has to be the tag again however this exits.
          trap 'git checkout --force "$GITHUB_SHA"' EXIT

          for attempt in 1 2 3; do
            git fetch --depth=1 origin main
            # Detached and --force, never a named branch: the build rewrote
            # every manifest in place, and git refuses to switch while a
            # modified file differs between the tag and main — the case this
            # loop exists for. `git branch -f` was worse than unnecessary: it
            # refuses to move a branch that is checked out, so every retry
            # after the first died with exit 128 before it could retry.
            git checkout --detach --force FETCH_HEAD
            ./scripts/set-dev-version.sh "$next"
            if git diff --quiet; then echo "main already declares $next"; exit 0; fi
            git add java/pom.xml java/opendataloader-pdf-core/pom.xml \
                    java/opendataloader-pdf-cli/pom.xml \
                    python/opendataloader-pdf/pyproject.toml \
                    python/opendataloader-pdf/uv.lock \
                    python/opendataloader-pdf-mcp/pyproject.toml \
                    python/opendataloader-pdf-mcp/uv.lock \
                    node/opendataloader-pdf/package.json
            git commit -m "chore: begin ${next}-SNAPSHOT"
            # Not `origin`: that carries the default GITHUB_TOKEN, and main
            # requires a pull request. GITHUB_TOKEN cannot be exempted from
            # that — `github-actions` is a runtime actor, so it never appears
            # in the ruleset's bypass list. The PAT pushes as its owner, who
            # is covered by the admin bypass entries. Kept in the URL rather
            # than `git config` so it stays out of .git/config.
            git push "https://x-access-token:${HOMEPAGE_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main && exit 0
            echo "push rejected, retrying ($attempt/3)" >&2
          done
          echo "::error::could not push the version bump — main still declares a released version" >&2
          exit 1

      # =================================================================
      # 6. SYNC DOCS TO HOMEPAGE (only on tag push)
      # =================================================================
      - name: Generate reference docs
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p content/docs/reference
          node scripts/generate-options.mjs
          node scripts/generate-schema.mjs

      - name: Push reference docs to homepage
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        # Pinned to v1.7.3 for security - verify before updating
        uses: cpina/github-action-push-to-another-repository@55306faa4ed53b815ae49e564af8cfb359d32ae2  # v1.7.3
        with:
          source-directory: 'content/docs/reference'
          destination-github-username: 'opendataloader-project'
          destination-repository-name: 'opendataloader.org'
          target-directory: 'apps/v1/content/docs/reference'
          target-branch: staging
        env:
          API_TOKEN_GITHUB: ${{ secrets.HOMEPAGE_SYNC_TOKEN }}
